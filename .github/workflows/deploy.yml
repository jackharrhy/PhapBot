name: Deploy to ghcr.io

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build candidate
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: phapbot:checked
          labels: |
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha || github.sha }}
            org.opencontainers.image.source=https://github.com/jackharrhy/PhapBot
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check syntax, dependencies, assets, and real TLS verifier
        run: |
          docker run --rm --entrypoint php phapbot:checked -l /app/phap.php
          docker run --rm --entrypoint sh phapbot:checked -c 'test ! -e /usr/local/bin/composer && cowsay phap && fortune && test -s /app/assets/bofh_excuses.txt'
          docker run --rm --entrypoint php -v "$PWD/tests:/checks:ro" phapbot:checked /checks/security.php

      - name: Check Composer dependency audit
        run: |
          docker buildx build --target dependencies --load -t phapbot:dependencies .
          docker run --rm --entrypoint composer phapbot:dependencies audit --no-dev

      - name: Log in to the Container registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          image=ghcr.io/jackharrhy/phapbot
          docker tag phapbot:checked "$image:latest"
          docker tag phapbot:checked "$image:sha-$GITHUB_SHA"
          docker push "$image:sha-$GITHUB_SHA"
          docker push "$image:latest"
          docker buildx imagetools inspect "$image:sha-$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
